<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermarkt-Angebote KW 32</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F0F2F5; color: #1A1A2E; }

/* ── PASSWORT-SCHUTZ ── */
#auth-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: #000; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
#auth-overlay.hidden { display: none; }
.auth-card {
  background: #111827; border-radius: 18px; padding: 36px 28px;
  width: 100%; max-width: 340px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.6);
}
.auth-card h2 { color: #fff; font-size: 1.3rem; margin-bottom: 6px; }
.auth-card p  { color: #9CA3AF; font-size: .85rem; margin-bottom: 24px; }
#auth-input {
  width: 100%; padding: 12px 16px; border-radius: 10px;
  border: 1.5px solid #374151; background: #1F2937; color: #fff;
  font-size: 1rem; font-family: inherit; outline: none; text-align: center;
  margin-bottom: 12px; letter-spacing: .1em;
}
#auth-input:focus { border-color: #6B7280; }
#auth-btn {
  width: 100%; padding: 13px; border-radius: 10px; border: none;
  background: #fff; color: #000; font-size: 1rem; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
#auth-btn:hover { background: #E5E7EB; }
#auth-error {
  color: #EF4444; font-size: .82rem; margin-top: 10px;
  min-height: 18px;
}

/* ── HEADER: reines Schwarz ── */
header {
  background: #000000; color: #fff;
  padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
header h1 { font-size: 1rem; font-weight: 700; }
header .kw { margin-left: auto; font-size: .78rem; color: #9CA3AF; }

.filters {
  background: #fff; border-bottom: 1px solid #E4E7ED;
  padding: 10px 20px; position: sticky; top: 53px; z-index: 190;
  box-shadow: 0 2px 6px rgba(0,0,0,.06);
}
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.filter-row:last-child { margin-bottom: 0; }
.filter-label { font-size: .7rem; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: .06em; min-width: 72px; flex-shrink: 0; }

.chip {
  padding: 5px 13px; border-radius: 20px; font-size: .78rem; font-weight: 600;
  cursor: pointer; border: 2px solid #ccc; background: #F3F4F6; color: #374151;
  transition: all .15s; user-select: none;
}
.chip.active { background: #374151; color: #fff; border-color: #374151; }

/* ── MARKT-CHIPS: Farben nach Brand-Vorgabe ── */
/* EDEKA: gelber Hintergrund, blaue Schrift */
.chip[data-store="EDEKA"] { border-color: #003882; color: #003882; background: #FFF5A0; }
.chip[data-store="EDEKA"].active { background: #FFD800; color: #003882; border-color: #003882; }

/* HIT: schwarzer Hintergrund, helles Rot */
.chip[data-store="HIT"] { border-color: #FF4444; color: #FF4444; background: #1C1C1C; }
.chip[data-store="HIT"].active { background: #000000; color: #FF6666; border-color: #FF4444; }

/* REWE: hellgrauer Hintergrund, rote Schrift */
.chip[data-store="REWE"] { border-color: #CC0000; color: #CC0000; background: #F3F4F6; }
.chip[data-store="REWE"].active { background: #E5E7EB; color: #CC0000; border-color: #CC0000; }

/* NETTO: unverändert */
.chip[data-store="NETTO"] { border-color: #CC0000; color: #CC0000; background: #FFFDE7; }
.chip[data-store="NETTO"].active { background: #CC0000; color: #FFD800; }

/* ALDI: unverändert */
.chip[data-store="ALDI"] { border-color: #0066B3; color: #0066B3; background: #EFF6FF; }
.chip[data-store="ALDI"].active { background: #0066B3; color: #fff; }

/* ── KATEGORIE-CHIPS: schwarzer Hintergrund, weiße Umrandung ── */
.chip[data-cat="Favoriten"] { border-color: #4B5563; color: #9B6FFF; background: #000; }
.chip[data-cat="Favoriten"].active { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Obst"]      { border-color: #4B5563; color: #4ADE80; background: #000; }
.chip[data-cat="Obst"].active      { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Fleisch"]   { border-color: #4B5563; color: #F87171; background: #000; }
.chip[data-cat="Fleisch"].active   { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Milch"]     { border-color: #4B5563; color: #38BDF8; background: #000; }
.chip[data-cat="Milch"].active     { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Getraenke"] { border-color: #4B5563; color: #22D3EE; background: #000; }
.chip[data-cat="Getraenke"].active { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Suesses"]   { border-color: #4B5563; color: #F472B6; background: #000; }
.chip[data-cat="Suesses"].active   { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Haushalt"]  { border-color: #4B5563; color: #2DD4BF; background: #000; }
.chip[data-cat="Haushalt"].active  { background: #000; color: #fff; border-color: #4B5563; }
.chip[data-cat="Sonstiges"] { border-color: #4B5563; color: #94A3B8; background: #000; }
.chip[data-cat="Sonstiges"].active { background: #000; color: #fff; border-color: #4B5563; }

main { padding: 20px; max-width: 1400px; margin: 0 auto; }

.section { margin-bottom: 28px; }
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid #E4E7ED;
}
.section-title { font-size: 1rem; font-weight: 700; }
.section-count { margin-left: auto; font-size: .75rem; color: #6B7280; background: #F0F2F5; padding: 2px 8px; border-radius: 10px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }

.card {
  background: #fff; border-radius: 10px; padding: 13px;
  border: 1px solid #E4E7ED; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  display: flex; flex-direction: column; gap: 4px;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.card-name { font-weight: 600; font-size: .85rem; line-height: 1.35; flex: 1; }

/* ── STORE-TAGS AUF DEN KARTEN: gleiche Logik wie Chips ── */
.store-tag { font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.tag-EDEKA { background: #FFD800; color: #003882; border: 1px solid #003882; }
.tag-HIT   { background: #111111; color: #FF2222; border: 1px solid #CC0000; }
.tag-REWE  { background: #F3F4F6; color: #CC0000; border: 1px solid #CC0000; }
.tag-NETTO { background: #FFFDE7; color: #CC0000; border: 1px solid #FFD800; }
.tag-ALDI  { background: #EFF6FF; color: #0066B3; border: 1px solid #93C5FD; }

.card-price { font-size: 1.2rem; font-weight: 800; }
.card-amount { font-size: .74rem; color: #6B7280; }
.card-vorwoche { font-size: .73rem; font-weight: 600; }
.vorw-down    { color: #16A34A; }
.vorw-up      { color: #DC2626; }
.vorw-neutral { color: #6B7280; }

.badge { display: inline-block; font-size: .65rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; text-transform: uppercase; margin-top: 2px; }
.b-Knaller { background: #FEE2E2; color: #991B1B; }
.b-WE      { background: #EDE9FE; color: #5B21B6; }
.b-App     { background: #D1FAE5; color: #065F46; }
.b-Netto   { background: #FEF3C7; color: #92400E; }
.b-best    { background: #FEF08A; color: #713F12; letter-spacing: .02em; }
.b-Dauer   { background: #F3F4F6; color: #4B5563; }

/* ── FAVORITEN-GRUPPE: optisch wie alle anderen Sektionen ── */
.fav-group { margin-bottom: 16px; }
.fav-group-title {
  font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em;
  color: #6B7280; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.fav-group-title::after { content: ''; flex: 1; height: 1px; background: #E4E7ED; }

.no-eier {
  background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 8px;
  padding: 10px 14px; font-size: .82rem; color: #64748B;
}

.subcat-label {
  font-size: .72rem; font-weight: 700; color: #6B7280; text-transform: uppercase;
  letter-spacing: .05em; margin: 12px 0 6px; padding-left: 4px;
  border-left: 3px solid #E4E7ED;
}

.empty { text-align: center; padding: 60px 20px; color: #6B7280; }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

/* ── DROPDOWN FILTER ── */
.dropdown { position: relative; display: inline-block; }

.dropdown-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 20px; font-size: .82rem; font-weight: 600;
  cursor: pointer; border: 2px solid #4B5563; background: #111; color: #fff;
  font-family: inherit; transition: border-color .15s, background .15s;
  user-select: none; min-height: 36px;
}
.dropdown-btn:hover { border-color: #9CA3AF; background: #1a1a1a; }
.dropdown-btn.open  { border-color: #fff; background: #222; }

.dd-arrow { font-size: .6rem; opacity: .7; transition: transform .2s; display: inline-block; }
.dropdown-btn.open .dd-arrow { transform: rotate(180deg); }

.dd-count {
  background: #374151; color: #fff; border-radius: 10px;
  font-size: .65rem; font-weight: 800; padding: 1px 7px; min-width: 20px;
  text-align: center;
}

.dropdown-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0;
  background: #fff; border: 1px solid #D1D5DB; border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 500; min-width: 200px;
  overflow: hidden;
}
.dropdown-menu.open { display: block; }

.dd-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; cursor: pointer; font-size: .85rem; color: #1A1A2E;
  transition: background .1s; user-select: none;
}
.dd-item:hover { background: #F3F4F6; }
.dd-item + .dd-item { border-top: 1px solid #F3F4F6; }
.dd-item input[type="checkbox"] {
  width: 17px; height: 17px; cursor: pointer; accent-color: #111; flex-shrink: 0;
}
.dd-item-label { flex: 1; }

.dd-header { display: flex; gap: 6px; padding: 8px 12px 6px; border-bottom: 1px solid #F3F4F6; }
.dd-all, .dd-none {
  flex: 1; padding: 5px 8px; border-radius: 12px; font-size: .72rem; font-weight: 700;
  cursor: pointer; border: 1px solid #E4E7ED; background: #F3F4F6; color: #374151;
  font-family: inherit; text-align: center; transition: background .1s;
}
.dd-all:hover { background: #D1FAE5; border-color: #6EE7B7; color: #065F46; }
.dd-none:hover { background: #FEE2E2; border-color: #FCA5A5; color: #991B1B; }

/* ── SUCHFELD ── */
.search-row { margin-top: 4px; }
.search-wrap {
  position: relative; display: flex; align-items: center;
  background: #F3F4F6; border: 2px solid #E4E7ED; border-radius: 20px;
  padding: 0 12px; max-width: 420px; transition: border-color .15s, background .15s;
}
.search-wrap:focus-within { border-color: #374151; background: #fff; }
.search-icon { font-size: .85rem; color: #9CA3AF; flex-shrink: 0; pointer-events: none; }
.search-input {
  flex: 1; border: none; background: transparent; padding: 7px 8px;
  font-size: .9rem; font-family: inherit; color: #1A1A2E; outline: none; min-height: 38px;
}
.search-input::placeholder { color: #9CA3AF; }
.search-clear {
  display: none; border: none; background: transparent; cursor: pointer;
  color: #9CA3AF; font-size: .9rem; padding: 4px 2px; line-height: 1;
  transition: color .15s;
}
.search-clear:hover { color: #374151; }
.search-clear.visible { display: block; }

/* ── EINKAUFSLISTE: Karten-Button ── */
.card-add-btn {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  margin-top: 8px; width: 100%; padding: 7px 0; border-radius: 8px;
  border: 1.5px dashed #D1D5DB; background: transparent; color: #6B7280;
  font-size: .75rem; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.card-add-btn:hover { border-color: #374151; color: #374151; background: #F3F4F6; }
.card-add-btn.added { border-style: solid; border-color: #16A34A; color: #16A34A; background: #F0FDF4; }
.card-add-btn.added:hover { border-color: #DC2626; color: #DC2626; background: #FEF2F2; }

/* ── EINKAUFSLISTE: Toggle-Button (unten links) ── */
#list-toggle {
  position: fixed; bottom: 24px; left: 20px; z-index: 400;
  width: 46px; height: 46px; border-radius: 50%;
  background: #000; color: #fff; border: 2px solid #4B5563;
  font-size: 1.2rem; cursor: pointer; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.35);
  transition: border-color .15s, transform .15s;
}
#list-toggle:hover { border-color: #fff; transform: translateY(-3px); }
#list-badge {
  position: absolute; top: -6px; right: -6px;
  background: #DC2626; color: #fff; border-radius: 50%;
  font-size: .6rem; font-weight: 800; min-width: 18px; height: 18px;
  display: none; align-items: center; justify-content: center; padding: 0 3px;
  border: 2px solid #fff;
}
#list-badge.visible { display: flex; }

/* ── EINKAUFSLISTE: Panel (Bottom Sheet) ── */
#list-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 600; backdrop-filter: blur(2px);
}
#list-overlay.open { display: block; }

#list-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 700;
  background: #fff; border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.2);
  transform: translateY(100%); transition: transform .3s ease;
  max-height: 80vh; display: flex; flex-direction: column;
}
#list-panel.open { transform: translateY(0); }

.list-panel-header {
  display: flex; align-items: center; padding: 16px 20px 12px;
  border-bottom: 1px solid #F3F4F6; flex-shrink: 0;
}
.list-panel-title { font-size: 1rem; font-weight: 700; flex: 1; }
.list-panel-count { font-size: .78rem; color: #6B7280; margin-right: 12px; }
.list-panel-close {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: #F3F4F6; color: #374151; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.list-panel-close:hover { background: #E5E7EB; }

.list-panel-body { flex: 1; overflow-y: auto; padding: 8px 0; }

.list-empty-msg {
  text-align: center; padding: 40px 20px; color: #9CA3AF; font-size: .9rem;
}

.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid #F9FAFB;
  transition: background .1s;
}
.list-item:hover { background: #F9FAFB; }
.list-item-check {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid #D1D5DB;
  background: #fff; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: all .15s; font-size: .8rem;
}
.list-item-check.checked { background: #16A34A; border-color: #16A34A; color: #fff; }
.list-item-info { flex: 1; min-width: 0; }
.list-item-name {
  font-size: .85rem; font-weight: 600; color: #1A1A2E;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all .15s;
}
.list-item.checked .list-item-name { text-decoration: line-through; color: #9CA3AF; }
.list-item-meta { font-size: .72rem; color: #9CA3AF; margin-top: 2px; }
.list-item-price { font-size: .85rem; font-weight: 700; color: #1A1A2E; flex-shrink: 0; }
.list-item.checked .list-item-price { color: #9CA3AF; }
.list-item-qty {
  display: flex; align-items: center; flex-shrink: 0;
  border: 1.5px solid #E5E7EB; border-radius: 8px; overflow: hidden; margin-right: 6px;
}
.list-item-qty-btn {
  width: 30px; height: 30px; border: none; background: #F3F4F6; color: #374151;
  font-size: 1.1rem; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: background .12s; line-height: 1;
}
.list-item-qty-btn:hover { background: #E5E7EB; }
.list-item-qty-num {
  min-width: 26px; text-align: center; font-size: .85rem; font-weight: 700; color: #111;
}

.list-item-remove {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: transparent; color: #D1D5DB; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .15s;
}
.list-item-remove:hover { background: #FEE2E2; color: #DC2626; }

.list-add-row {
  display: flex; gap: 8px; padding: 10px 16px 6px; flex-shrink: 0;
  border-top: 1px solid #F3F4F6;
}
#list-custom-input {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  border: 1.5px solid #E5E7EB; font-size: .9rem; font-family: inherit;
  background: #F9FAFB; color: #111; outline: none; min-width: 0;
}
#list-custom-input:focus { border-color: #6B7280; background: #fff; }
#list-custom-add {
  width: 44px; height: 44px; border-radius: 10px; border: none;
  background: #111827; color: #fff; font-size: 1.5rem; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
#list-custom-add:hover { background: #374151; }

.list-panel-footer {
  padding: 10px 16px 12px; border-top: 1px solid #F3F4F6; flex-shrink: 0;
}
.list-clear-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  border: 1.5px solid #FCA5A5; background: #FFF; color: #DC2626;
  font-size: .85rem; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.list-clear-btn:hover { background: #FEF2F2; }
.list-clear-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── SCROLL-TO-TOP ── */
#scroll-top {
  position: fixed; bottom: 24px; right: 20px; z-index: 400;
  width: 46px; height: 46px; border-radius: 50%;
  background: #000; color: #fff; border: 2px solid #4B5563;
  font-size: 1.2rem; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(0,0,0,.35);
  transition: border-color .15s, transform .15s; opacity: 0;
}
#scroll-top.visible { display: flex; opacity: 1; }
#scroll-top:hover { border-color: #fff; transform: translateY(-3px); }
</style>
</head>
<body>
<!-- Passwort-Schutz -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>🛒 Supermarkt-Angebote</h2>
    <p>Bitte Passwort eingeben</p>
    <input id="auth-input" type="password" placeholder="Passwort" autocomplete="off" />
    <button id="auth-btn" type="button">Weiter</button>
    <div id="auth-error"></div>
  </div>
</div>

<header>
  <span>🛒</span>
  <h1>Supermarkt-Angebote</h1>
  <span class="kw">KW 32 · 03.–08.08.2026</span>
</header>

<div class="filters">
  <!-- Märkte-Dropdown -->
  <div class="filter-row">
    <span class="filter-label">Märkte</span>
    <div class="dropdown" id="dd-store">
      <button class="dropdown-btn" id="dd-store-btn" type="button">
        <span id="dd-store-text">Alle Märkte</span>
        <span class="dd-arrow">▾</span>
      </button>
      <div class="dropdown-menu" id="dd-store-menu">
        <div class="dd-header"><button class="dd-all" type="button">✓ Alle</button><button class="dd-none" type="button">✕ Keine</button></div>
        <label class="dd-item"><input type="checkbox" value="EDEKA" checked><span class="dd-item-label">🔵 EDEKA</span></label>
        <label class="dd-item"><input type="checkbox" value="HIT"   checked><span class="dd-item-label">🔴 HIT</span></label>
        <label class="dd-item"><input type="checkbox" value="REWE"  checked><span class="dd-item-label">🔴 REWE</span></label>
        <label class="dd-item"><input type="checkbox" value="NETTO" checked><span class="dd-item-label">🟡 NETTO</span></label>
        <label class="dd-item"><input type="checkbox" value="ALDI"  checked><span class="dd-item-label">🔵 ALDI Süd</span></label>
      </div>
    </div>
  </div>
  <!-- Kategorien-Dropdown -->
  <div class="filter-row">
    <span class="filter-label">Kategorie</span>
    <div class="dropdown" id="dd-cat">
      <button class="dropdown-btn" id="dd-cat-btn" type="button">
        <span id="dd-cat-text">Alle Kategorien</span>
        <span class="dd-arrow">▾</span>
      </button>

// ── PASSWORT-SCHUTZ ──
(function() {
  var PW = 'Aachen';
  var KEY = 'sp_auth';
  var overlay = document.getElementById('auth-overlay');
  if (localStorage.getItem(KEY) === '1') { overlay.classList.add('hidden'); return; }
  var inp = document.getElementById('auth-input');
  var btn = document.getElementById('auth-btn');
  var err = document.getElementById('auth-error');
  function tryLogin() {
    if (inp.value === PW) {
      localStorage.setItem(KEY, '1');
      overlay.classList.add('hidden');
    } else {
      err.textContent = 'Falsches Passwort. Bitte erneut versuchen.';
      inp.value = '';
      inp.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryLogin(); });
  inp.focus();
})();

function parsePriceNum(s) {
  if (!s) return Infinity;
  var m = s.replace(/[^\d,\.]/g, ' ').trim().match(/\d+[,.]\d+|\d+/g);
  if (!m) return Infinity;
  return parseFloat(m[0].replace(',', '.'));
}

function computeBestPrices() {
  bestPriceIds = {};
  FAV_ORDER.forEach(function(grp) {
    if (grp === 'Eier') return;
    var grpItems = P.filter(function(p) {
      return activeStores[p.s] && p.f === grp && matchesSearch(p);
    });
    if (grpItems.length < 2) return; // Vergleich nur sinnvoll bei mind. 2 Produkten
    var minPrice = Infinity;
    grpItems.forEach(function(p) {
      var v = parsePriceNum(p.p);
      if (v < minPrice) minPrice = v;
    });
    if (minPrice === Infinity) return;
    grpItems.forEach(function(p) {
      if (parsePriceNum(p.p) === minPrice) {
        bestPriceIds[p.s + '__' + p.n] = true;
      }
    });
  });
}
function matchesSearch(p) {
  if (!searchTerm) return true;
  return p.n.toLowerCase().indexOf(searchTerm) !== -1;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function makeBadge(b) {
  if (!b) return '';
  var cls = {Knaller:'b-Knaller',WE:'b-WE',App:'b-App',Netto:'b-Netto',Dauer:'b-Dauer'}[b] || 'b-Dauer';
  var label = b === 'WE' ? 'WE-Knüller' : b === 'Netto' ? 'Netto+' : b === 'ALDI-WE' ? 'ab 07.08.' : b;
  return '<span class="badge '+cls+'">'+escHtml(label)+'</span>';
}

function makeCard(item) {
  var vorw = '';
  if (item.v) {
    var vCls, vPfx;
    if (item.v.indexOf('▲') !== -1) {
      vCls = 'vorw-up';      vPfx = '▲ ';
    } else if (item.v.indexOf('▼') !== -1 || item.v.indexOf('statt') !== -1) {
      vCls = 'vorw-down';    vPfx = '↓ ';
    } else {
      vCls = 'vorw-neutral'; vPfx = '';
    }
    vorw = '<div class="card-vorwoche '+vCls+'">'+vPfx+escHtml(item.v)+'</div>';
  }
  var badge = makeBadge(item.b);
  var itemId = item.s + '__' + item.n;
  var bestBadge = bestPriceIds[itemId] ? '<span class="badge b-best">💰 Bester Preis</span>' : '';
  var inList = listHasItem(itemId);
  var addBtn = '<button class="card-add-btn'+(inList?' added':'')+'" '
    +'data-id="'+escHtml(itemId)+'" '
    +'data-name="'+escHtml(item.n)+'" '
    +'data-store="'+escHtml(item.s)+'" '
    +'data-price="'+escHtml(item.p)+'" '
    +'data-amount="'+escHtml(item.a)+'" '
    +'type="button">'
    +(inList ? '✓ In der Liste (entfernen)' : '+ Zur Einkaufsliste')
    +'</button>';
  return '<div class="card">'
    +'<div class="card-top"><div class="card-name">'+escHtml(item.n)+'</div>'
    +'<span class="store-tag tag-'+item.s+'">'+item.s+'</span></div>'
    +'<div class="card-price">'+escHtml(item.p)+'</div>'
    +'<div class="card-amount">'+escHtml(item.a)+'</div>'
    +vorw+badge+bestBadge+addBtn
    +'</div>';
}

function render() {
  var html = '';
  computeBestPrices();

  // --- Favoriten section ---
  if (activeCats['Favoriten']) {
    var favItems = P.filter(function(p){ return activeStores[p.s] && p.f && matchesSearch(p); });
    html += '<div class="section">'
      +'<div class="section-head" style="border-color:#D97706">'
      +'<span>⭐</span>'
      +'<span class="section-title">Favoriten</span>'
      +'<span class="section-count">'+favItems.length+' Angebote</span>'
      +'</div>';

    FAV_ORDER.forEach(function(grp) {
      if (grp === 'Eier') {
        html += '<div class="fav-group"><div class="fav-group-title">'+FAV_LABELS[grp]+'</div>'
          +'<div class="no-eier">Keine Eier-Angebote in den aktuellen Prospekten.</div></div>';
        return;
      }
      var grpItems = favItems.filter(function(p){ return p.f === grp; });
      if (!grpItems.length) return;
      html += '<div class="fav-group"><div class="fav-group-title">'+FAV_LABELS[grp]+'</div>'
        +'<div class="grid">'+grpItems.map(makeCard).join('')+'</div></div>';
    });

    html += '</div>';
  }

  // --- Regular categories ---
  var cats = ["Obst","Fleisch","Milch","Getraenke","Suesses","Haushalt","Sonstiges"];
  cats.forEach(function(cat) {
    if (!activeCats[cat]) return;
    var items = P.filter(function(p){ return activeStores[p.s] && p.c === cat && matchesSearch(p); });
    if (!items.length) return;

    html += '<div class="section">'
      +'<div class="section-head">'
      +'<span>'+CAT_ICONS[cat]+'</span>'
      +'<span class="section-title">'+escHtml(CAT_LABELS[cat])+'</span>'
      +'<span class="section-count">'+items.length+' Angebote</span>'
      +'</div>';

    if (cat === 'Sonstiges') {
      // Group by subcat
      var subcats = [];
      var seen = {};
      items.forEach(function(p){ var k = p.x||'Sonstiges'; if(!seen[k]){ seen[k]=1; subcats.push(k); }});
      subcats.forEach(function(sc) {
        var scItems = items.filter(function(p){ return (p.x||'Sonstiges') === sc; });
        html += '<div class="subcat-label">'+escHtml(sc)+'</div>'
          +'<div class="grid">'+scItems.map(makeCard).join('')+'</div>';
      });
    } else {
      html += '<div class="grid">'+items.map(makeCard).join('')+'</div>';
    }

    html += '</div>';
  });

  if (!html) {
    html = '<div class="empty"><div class="empty-icon">🔍</div><h2>Keine Angebote gefunden</h2><p>Bitte wähle mindestens einen Markt und eine Kategorie.</p></div>';
  }

  document.getElementById('app').innerHTML = html;
}

// --- Chip interactions ---
document.querySelectorAll('.chip[data-store]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var store = chip.getAttribute('data-store');
    var active = Object.keys(activeStores).filter(function(k){ return activeStores[k]; });
    if (activeStores[store] && active.length <= 1) return; // keep at least one
    activeStores[store] = !activeStores[store];
    chip.classList.toggle('active', activeStores[store]);
    render();
  });
});

document.querySelectorAll('.chip[data-cat]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var cat = chip.getAttribute('data-cat');
    var active = Object.keys(activeCats).filter(function(k){ return activeCats[k]; });
    if (activeCats[cat] && active.length <= 1) return;
    activeCats[cat] = !activeCats[cat];
    chip.classList.toggle('active', activeCats[cat]);
    render();
  });
});

// ── EINKAUFSLISTE – Helfer müssen vor render() definiert sein ──
(function() {
  var LS_KEY = 'supermarkt_list';

  function loadList() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) { return []; }
  }
  function saveList(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch(e) {}
  }

  window.listHasItem = function(id) {
    return loadList().some(function(i) { return i.id === id; });
  };

// Initial render
render();

  function updateBadge() {
    var list = loadList();
    var badge = document.getElementById('list-badge');
    var unchecked = list.filter(function(i){ return !i.checked; }).length;
    badge.textContent = unchecked || list.length;
    badge.classList.toggle('visible', list.length > 0);
  }

  function renderPanel() {
    var list   = loadList();
    var body   = document.getElementById('list-panel-body');
    var count  = document.getElementById('list-panel-count');
    var clrBtn = document.getElementById('list-clear-btn');

    count.textContent = list.length ? list.length + ' Artikel' : '';
    clrBtn.disabled = list.length === 0;

    if (!list.length) {
      body.innerHTML = '<div class="list-empty-msg">Noch nichts auf der Liste.<br>Tippe auf „+ Zur Einkaufsliste" auf einer Karte.</div>';
      return;
    }

    body.innerHTML = list.map(function(item) {
      return '<div class="list-item'+(item.checked?' checked':'')+'" data-id="'+escHtml(item.id)+'">'
        +'<button class="list-item-check'+(item.checked?' checked':'')+'" data-id="'+escHtml(item.id)+'" type="button">'
        +(item.checked ? '✓' : '')
        +'</button>'
        +'<div class="list-item-info">'
        +'<div class="list-item-name">'+escHtml(item.name)+'</div>'
        +'<div class="list-item-meta">'+escHtml(item.store)+(item.amount?' · '+escHtml(item.amount):'')+(item.price?' · '+escHtml(item.price):'')+'</div>'
        +'</div>'
        +'<div class="list-item-qty">'
        +'<button class="list-item-qty-btn" data-id="'+escHtml(item.id)+'" data-action="dec" type="button">−</button>'
        +'<span class="list-item-qty-num">'+(item.qty||1)+'</span>'
        +'<button class="list-item-qty-btn" data-id="'+escHtml(item.id)+'" data-action="inc" type="button">+</button>'
        +'</div>'
        +'<button class="list-item-remove" data-id="'+escHtml(item.id)+'" type="button" title="Entfernen">×</button>'
        +'</div>';
    }).join('');
  }

  function openPanel() {
    renderPanel();
    document.getElementById('list-overlay').classList.add('open');
    document.getElementById('list-panel').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closePanel() {
    document.getElementById('list-overlay').classList.remove('open');
    document.getElementById('list-panel').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Toggle-Button
  document.getElementById('list-toggle').addEventListener('click', openPanel);
  document.getElementById('list-panel-close').addEventListener('click', closePanel);
  document.getElementById('list-overlay').addEventListener('click', closePanel);

  // Alle löschen
  document.getElementById('list-clear-btn').addEventListener('click', function() {
    if (!confirm('Einkaufsliste leeren?')) return;
    saveList([]);
    updateBadge();
    renderPanel();
    render(); // Karten-Buttons aktualisieren
  });

  // Klick auf Check / Entfernen im Panel
  document.getElementById('list-panel-body').addEventListener('click', function(e) {
    var checkBtn  = e.target.closest('.list-item-check');
    var removeBtn = e.target.closest('.list-item-remove');
    var qtyBtn    = e.target.closest('.list-item-qty-btn');

    if (qtyBtn) {
      var id  = qtyBtn.dataset.id;
      var inc = qtyBtn.dataset.action === 'inc';
      var list = loadList().map(function(i) {
        if (i.id !== id) return i;
        var qty = Math.max(1, (i.qty || 1) + (inc ? 1 : -1));
        return Object.assign({}, i, {qty: qty});
      });
      saveList(list);
      renderPanel();
      return;
    }

    if (checkBtn) {
      var id = checkBtn.dataset.id;
      var list = loadList();
      list = list.map(function(i) {
        return i.id === id ? Object.assign({}, i, {checked: !i.checked}) : i;
      });
      saveList(list);
      updateBadge();
      renderPanel();
    }
    if (removeBtn) {
      var id = removeBtn.dataset.id;
      var list = loadList().filter(function(i) { return i.id !== id; });
      saveList(list);
      updateBadge();
      renderPanel();
      render(); // Karten-Button zurücksetzen
    }
  });

  // Klick auf „+ Zur Einkaufsliste" auf einer Karte
  document.getElementById('app').addEventListener('click', function(e) {
    var btn = e.target.closest('.card-add-btn');
    if (!btn) return;
    var id = btn.dataset.id;
    var list = loadList();
    var idx = list.findIndex(function(i) { return i.id === id; });
    if (idx !== -1) {
      // Bereits drin → entfernen
      list.splice(idx, 1);
    } else {
      // Hinzufügen
      list.push({
        id:      id,
        name:    btn.dataset.name,
        store:   btn.dataset.store,
        price:   btn.dataset.price,
        amount:  btn.dataset.amount,
        checked: false
      });
    }
    saveList(list);
    updateBadge();
    // Nur den geklickten Button sofort updaten (ohne volles re-render)
    var inList = list.some(function(i) { return i.id === id; });
    btn.classList.toggle('added', inList);
    btn.textContent = inList ? '✓ In der Liste (entfernen)' : '+ Zur Einkaufsliste';
    // Panel-Inhalt live aktualisieren falls offen
    if (document.getElementById('list-panel').classList.contains('open')) renderPanel();
  });

  // Eigenes Produkt hinzufügen
  function addCustomItem() {
    var inp = document.getElementById('list-custom-input');
    var name = inp.value.trim();
    if (!name) return;
    var list = loadList();
    list.push({
      id:      'custom__' + Date.now(),
      name:    name,
      store:   'Eigener Eintrag',
      price:   '',
      amount:  '',
      checked: false
    });
    saveList(list);
    updateBadge();
    renderPanel();
    inp.value = '';
    inp.focus();
  }

  document.getElementById('list-custom-add').addEventListener('click', addCustomItem);
  document.getElementById('list-custom-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addCustomItem(); }
  });

  // Init
  updateBadge();
})();

// ── SUCHFELD ──
(function() {
  var inp = document.getElementById('search-input');
  var clr = document.getElementById('search-clear');

  inp.addEventListener('input', function() {
    searchTerm = inp.value.trim().toLowerCase();
    clr.classList.toggle('visible', searchTerm.length > 0);
    render();
  });

  clr.addEventListener('click', function() {
    inp.value = '';
    searchTerm = '';
    clr.classList.remove('visible');
    inp.focus();
    render();
  });
})();

// ── SCROLL-TO-TOP ──
(function() {
  var btn = document.getElementById('scroll-top');
  window.addEventListener('scroll', function() {
    btn.classList.toggle('visible', window.scrollY > 150);
  }, { passive: true });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// ── DROPDOWN FILTER LOGIC ──
(function() {
  var STORE_NAMES = { EDEKA:'EDEKA', HIT:'HIT', REWE:'REWE', NETTO:'NETTO', ALDI:'ALDI Süd' };
  var CAT_NAMES   = { Favoriten:'Favoriten', Obst:'Obst & Gemüse', Fleisch:'Fleisch & Wurst',
                      Milch:'Milchprodukte', Getraenke:'Getränke', Suesses:'Süßwaren',
                      Haushalt:'Haushaltsmittel', Sonstiges:'Sonstiges' };

  function updateBtnText(textId, stateObj, names, singular, plural) {
    var el = document.getElementById(textId);
    var total   = Object.keys(names).length;
    var checked = Object.keys(stateObj).filter(function(k) { return stateObj[k]; });
    if (checked.length === total) {
      el.textContent = 'Alle ' + plural;
    } else if (checked.length === 0) {
      el.textContent = 'Wähle ' + singular + ' aus';
    } else if (checked.length <= 2) {
      el.textContent = checked.map(function(k) { return names[k]; }).join(', ');
    } else {
      el.textContent = checked.length + ' von ' + total + ' ' + plural;
    }
  }

  function setupDD(btnId, menuId, textId, stateObj, names, singular, plural) {
    var btn  = document.getElementById(btnId);
    var menu = document.getElementById(menuId);

    // Toggle on button click
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var opening = !menu.classList.contains('open');
      closeAll();
      if (opening) {
        menu.classList.add('open');
        btn.classList.add('open');
      }
    });

    // Checkbox changes
    menu.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      cb.addEventListener('change', function(e) {
        e.stopPropagation();
        stateObj[cb.value] = cb.checked;
        updateBtnText(textId, stateObj, names, singular, plural);
        render();
      });
    });

    // Alle / Keine
    var allBtn  = menu.querySelector('.dd-all');
    var noneBtn = menu.querySelector('.dd-none');
    if (allBtn) {
      allBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
          cb.checked = true; stateObj[cb.value] = true;
        });
        updateBtnText(textId, stateObj, names, singular, plural);
        render();
      });
    }
    if (noneBtn) {
      noneBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        menu.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
          cb.checked = false; stateObj[cb.value] = false;
        });
        updateBtnText(textId, stateObj, names, singular, plural);
        render();
      });
    }

    // Init button label
    updateBtnText(textId, stateObj, names, singular, plural);
  }

  function closeAll() {
    document.querySelectorAll('.dropdown-menu').forEach(function(m) { m.classList.remove('open'); });
    document.querySelectorAll('.dropdown-btn').forEach(function(b)  { b.classList.remove('open'); });
  }

  // Close on outside click
  document.addEventListener('click', closeAll);
  // Prevent menu-clicks from closing the dropdown
  document.querySelectorAll('.dropdown-menu').forEach(function(m) {
    m.addEventListener('click', function(e) { e.stopPropagation(); });
  });

  setupDD('dd-store-btn', 'dd-store-menu', 'dd-store-text', activeStores, STORE_NAMES, 'deine Märkte', 'Märkte');
  setupDD('dd-cat-btn',   'dd-cat-menu',   'dd-cat-text',  activeCats,   CAT_NAMES,   'deine Kategorien', 'Kategorien');
})();
</script>
