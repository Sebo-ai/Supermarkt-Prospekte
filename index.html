.card {

P.push({s:"ALDI",c:"Fleisch",n:"Puten-Geschnetzeltes (MEINE METZGEREI) ab 07.08.",p:"5,99 €",a:"800 g (7,49/kg)",v:"neu im Angebot",b:"WE",f:""});
// Milchprodukte
P.push({s:"ALDI",c:"Milch",n:"Ehrmann Grand Dessert Vanille (ab 07.08.)",p:"0,49 €",a:"190 g (2,58/kg)",v:"neu im Angebot",b:"WE",f:"Joghurt"});
P.push({s:"ALDI",c:"Milch",n:"Arla Buko Frischkäse (ab 07.08.)",p:"0,99 €",a:"200 g (4,95/kg)",v:"neu im Angebot",b:"WE",f:""});
P.push({s:"ALDI",c:"Milch",n:"Landliebe Haltbare Milch 1,5% (ab 07.08.)",p:"0,99 €",a:"1 l",v:"neu im Angebot",b:"WE",f:"Milch"});
// Getränke
P.push({s:"ALDI",c:"Getraenke",n:"Valensina Orangensaft",p:"1,49 €",a:"1 l (+0,25 € Pfand)",v:"statt 2,49 € (-40%)",b:"",f:""});
// Süßwaren
P.push({s:"ALDI",c:"Suesses",n:"Funny Frisch Jumpys Paprika (ab 07.08.)",p:"1,19 €",a:"90 g",v:"neu im Angebot",b:"WE",f:""});
P.push({s:"ALDI",c:"Suesses",n:"Magnum Multipack Mix (TK, ab 07.08.)",p:"3,49 €",a:"770 ml",v:"neu im Angebot",b:"WE",f:""});
P.push({s:"ALDI",c:"Suesses",n:"Dallmayr Classic mild (ab 07.08.)",p:"6,99 €",a:"500 g",v:"neu im Angebot",b:"WE",f:""});
// Sonstiges
P.push({s:"ALDI",c:"Sonstiges",n:"Bertolli Olivenöl Robusto (ab 07.08.)",p:"4,99 €",a:"500 ml (9,98/l)",v:"neu im Angebot",b:"WE",f:"",x:"Lebensmittel"});
P.push({s:"ALDI",c:"Sonstiges",n:"Landfreude Frischei-Nudeln (ab 07.08.)",p:"1,49 €",a:"500 g (2,98/kg)",v:"neu im Angebot",b:"WE",f:"",x:"Nudeln"});

// ====== RENDER LOGIC ======
var CAT_LABELS = {
  "Obst": "Obst & Gemüse",
  "Fleisch": "Fleisch & Wurst",
  "Milch": "Milchprodukte",
  "Getraenke": "Getränke",
  "Suesses": "Süßwaren",
  "Haushalt": "Haushaltsmittel",
  "Sonstiges": "Sonstiges"
};
var CAT_ICONS = {
  "Obst": "🥬", "Fleisch": "🥩", "Milch": "🥛",
  "Getraenke": "🍺", "Suesses": "🍫", "Haushalt": "🧹", "Sonstiges": "📦"
};
var FAV_ORDER = ["Milch","Eier","Skyr","Joghurt","Fleisch","Nudeln"];
var FAV_LABELS = {
  "Milch":"🥛 Milch","Eier":"🥚 Eier","Skyr":"🥣 Skyr",
  "Joghurt":"🍶 Joghurt","Fleisch":"🥩 Fleisch","Nudeln":"🍝 Barilla & De Cecco Nudeln"
};

var activeStores = {EDEKA:true, HIT:true, REWE:true, NETTO:true, ALDI:true};
var activeCats = {Favoriten:true, Obst:true, Fleisch:true, Milch:true, Getraenke:true, Suesses:true, Haushalt:true, Sonstiges:true};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function makeBadge(b) {
  if (!b) return '';
  var cls = {Knaller:'b-Knaller',WE:'b-WE',App:'b-App',Netto:'b-Netto',Dauer:'b-Dauer'}[b] || 'b-Dauer';
  var label = b === 'WE' ? 'WE-Knüller' : b === 'Netto' ? 'Netto+' : b === 'ALDI-WE' ? 'ab 07.08.' : b;
  return '<span class="badge '+cls+'">'+escHtml(label)+'</span>';
}

function makeCard(item) {
  var vorw = item.v ? '<div class="card-vorwoche">&#8595; '+escHtml(item.v)+'</div>' : '';
  var badge = makeBadge(item.b);
  return '<div class="card">'
    +'<div class="card-top"><div class="card-name">'+escHtml(item.n)+'</div>'
    +'<span class="store-tag tag-'+item.s+'">'+item.s+'</span></div>'
    +'<div class="card-price">'+escHtml(item.p)+'</div>'
    +'<div class="card-amount">'+escHtml(item.a)+'</div>'
    +vorw+badge
    +'</div>';
}

function render() {
  var html = '';

  // --- Favoriten section ---
  if (activeCats['Favoriten']) {
    var favItems = P.filter(function(p){ return activeStores[p.s] && p.f; });
    html += '<div class="section">'
      +'<div class="section-head" style="border-color:#D97706">'
      +'<span>⭐</span>'
      +'<span class="section-title">Favoriten</span>'
      +'<span class="section-count">'+favItems.length+' Angebote</span>'
      +'</div>';

    FAV_ORDER.forEach(function(grp) {
      if (grp === 'Eier') {
        html += '<div class="fav-group"><div class="fav-group-title">'+FAV_LABELS[grp]+'</div>'
          +'<div class="no-eier">Keine Eier-Angebote in den aktuellen Prospekten.</div></div>';
        return;
      }
      var grpItems = favItems.filter(function(p){ return p.f === grp; });
      if (!grpItems.length) return;
      html += '<div class="fav-group"><div class="fav-group-title">'+FAV_LABELS[grp]+'</div>'
        +'<div class="grid">'+grpItems.map(makeCard).join('')+'</div></div>';
    });

    html += '</div>';
  }

  // --- Regular categories ---
  var cats = ["Obst","Fleisch","Milch","Getraenke","Suesses","Haushalt","Sonstiges"];
  cats.forEach(function(cat) {
    if (!activeCats[cat]) return;
    var items = P.filter(function(p){ return activeStores[p.s] && p.c === cat; });
    if (!items.length) return;

    html += '<div class="section">'
      +'<div class="section-head">'
      +'<span>'+CAT_ICONS[cat]+'</span>'
      +'<span class="section-title">'+escHtml(CAT_LABELS[cat])+'</span>'
      +'<span class="section-count">'+items.length+' Angebote</span>'
      +'</div>';

    if (cat === 'Sonstiges') {
      // Group by subcat
      var subcats = [];
      var seen = {};
      items.forEach(function(p){ var k = p.x||'Sonstiges'; if(!seen[k]){ seen[k]=1; subcats.push(k); }});
      subcats.forEach(function(sc) {
        var scItems = items.filter(function(p){ return (p.x||'Sonstiges') === sc; });
        html += '<div class="subcat-label">'+escHtml(sc)+'</div>'
          +'<div class="grid">'+scItems.map(makeCard).join('')+'</div>';
      });
    } else {
      html += '<div class="grid">'+items.map(makeCard).join('')+'</div>';
    }

    html += '</div>';
  });

  if (!html) {
    html = '<div class="empty"><div class="empty-icon">🔍</div><h2>Keine Angebote gefunden</h2><p>Bitte wähle mindestens einen Markt und eine Kategorie.</p></div>';
  }

  document.getElementById('app').innerHTML = html;
}

// --- Chip interactions ---
document.querySelectorAll('.chip[data-store]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var store = chip.getAttribute('data-store');
    var active = Object.keys(activeStores).filter(function(k){ return activeStores[k]; });
    if (activeStores[store] && active.length <= 1) return; // keep at least one
    activeStores[store] = !activeStores[store];
    chip.classList.toggle('active', activeStores[store]);
    render();
  });
});

document.querySelectorAll('.chip[data-cat]').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var cat = chip.getAttribute('data-cat');
    var active = Object.keys(activeCats).filter(function(k){ return activeCats[k]; });
    if (activeCats[cat] && active.length <= 1) return;
    activeCats[cat] = !activeCats[cat];
    chip.classList.toggle('active', activeCats[cat]);
    render();
  });
});

// Initial render
render();
</script>
</body>
</html>
